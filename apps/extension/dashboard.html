<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Surge Dashboard</title>
    <link rel="icon" type="image/png" href="./icons/icon-48.png" />
    <script>
      (function () {
        try {
          if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="./src/index.css" />
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 min-h-screen text-slate-800 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="./src/dashboard/index.tsx"></script>
  </body>
</html>
